services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./realm/bifrost-local-realm.json:/opt/keycloak/data/import/bifrost-local-realm.json:ro

  # Gives the Bifrost OIDC client the least-privilege Keycloak Admin API roles
  # needed for development user and group synchronization. It is safe to run on
  # every `docker compose up`: adding an existing role mapping is idempotent.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.8.1
    depends_on:
      - keycloak
    entrypoint: ["/bin/sh", "/opt/keycloak/init/configure-service-account.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_REALM: bifrost-local
      BIFROST_CLIENT_ID: bifrost-oidc
    volumes:
      - ./configure-service-account.sh:/opt/keycloak/init/configure-service-account.sh:ro
    restart: "no"

volumes:
  keycloak-data:
